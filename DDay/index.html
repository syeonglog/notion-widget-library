
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My D-Day Tracker</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="widget">

        <!-- Header -->
        <header class="widget-header">
            <div class="header-text">
                <h1>D-Day Tracker</h1>
                <p>COUNTING THE DAYS</p>
            </div>

            <button
                id="add-event-btn"
                class="add-button"
                type="button"
                aria-label="일정 추가"
                title="Add Event"
            >+</button>
        </header>

        <!-- 일정 목록 -->
        <section class="events-section">

            <div class="section-header">
                <h2>Upcoming Events</h2>

                <button
                    id="toggle-past-btn"
                    class="text-button"
                    type="button"
                >
                    Show Past
                </button>
            </div>

            <div id="events-grid" class="events-grid"></div>

            <div id="empty-state" class="empty-state" hidden>
                <p>No events yet</p>
                <span>Click + to add your first event.</span>
            </div>

        </section>

        <!-- 일정 편집창 -->
        <section
            id="editor-panel"
            class="editor-panel"
            aria-labelledby="editor-title"
            hidden
        >
            <div class="editor-header">
                <h2 id="editor-title">Add Event</h2>

                <button
                    id="close-editor-btn"
                    class="close-button"
                    type="button"
                    aria-label="닫기"
                >×</button>
            </div>

            <form id="event-form" novalidate>

                <div class="field">
                    <label for="event-name">Event Name</label>
                    <input
                        id="event-name"
                        type="text"
                        maxlength="100"
                        placeholder="e.g. TOEIC Exam"
                        required
                    >
                </div>

                <div class="field">
                    <label for="event-date">Target Date</label>
                    <input
                        id="event-date"
                        type="date"
                        required
                    >
                </div>

                <div class="field">
                    <label for="event-note">Memo (Optional)</label>
                    <textarea
                        id="event-note"
                        rows="2"
                        maxlength="300"
                        placeholder="Add a short memo..."
                    ></textarea>
                </div>

                <!-- 색상 설정 -->
                <div class="color-fields">

                    <div class="field">
                        <label for="event-text-color">
                            Text Color
                        </label>

                        <div class="color-input-wrap">
                            <span
                                id="text-color-swatch"
                                class="color-swatch"
                            ></span>

                            <input
                                id="event-text-color"
                                type="text"
                                maxlength="7"
                                placeholder="#333333"
                                spellcheck="false"
                            >
                        </div>
                    </div>

                    <div class="field">
                        <label for="event-bg-color">
                            Background Color
                        </label>

                        <div class="color-input-wrap">
                            <span
                                id="bg-color-swatch"
                                class="color-swatch"
                            ></span>

                            <input
                                id="event-bg-color"
                                type="text"
                                maxlength="7"
                                placeholder="#F7F7F7"
                                spellcheck="false"
                            >
                        </div>
                    </div>

                </div>

                <!-- 미리보기 -->
                <div class="preview-section">
                    <p class="preview-label">PREVIEW</p>

                    <div id="event-preview" class="event-preview">
                        <p id="preview-name">Event Name</p>
                        <strong id="preview-dday">D-20</strong>
                        <span id="preview-date">2026.11.29 SUN</span>
                    </div>
                </div>

                <p id="form-error" class="form-error" role="alert"></p>

                <div class="form-actions">
                    <button
                        id="delete-event-btn"
                        class="delete-button"
                        type="button"
                        hidden
                    >
                        Delete
                    </button>

                    <div class="action-right">
                        <button
                            id="cancel-editor-btn"
                            class="button button-secondary"
                            type="button"
                        >
                            Cancel
                        </button>

                        <button
                            class="button button-primary"
                            type="submit"
                        >
                            Save
                        </button>
                    </div>
                </div>

            </form>
        </section>

    </main>
</body>
</html>
