<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Little Things | My Daily To-Do</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="widget">

        <!-- Header -->
        <header class="widget-header">
            <div>
                <p class="eyebrow">LITTLE THINGS</p>
                <h1>Make today count <span>♡</span></h1>
                <p class="today-date" id="todayDate"></p>
            </div>

            <div class="header-icon">♡</div>
        </header>

        <!-- Progress -->
        <section class="progress-card">
            <div class="progress-top">
                <h2>Today's Progress</h2>
                <span id="progressCount">0 / 0</span>
            </div>

            <div
                class="progress-track"
                role="progressbar"
                aria-label="오늘의 할 일 달성률"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                id="progressTrack"
            >
                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>
            </div>

            <p id="progressText">오늘도 작은 것부터 시작해 봐요 ♡</p>
        </section>

        <!-- Summary -->
        <section class="summary-grid" aria-label="할 일 요약">
            <button
                type="button"
                class="summary-card active"
                data-view="today"
            >
                <span class="summary-label">TODAY</span>
                <strong id="todayCount">00</strong>
            </button>

            <button
                type="button"
                class="summary-card"
                data-view="tomorrow"
            >
                <span class="summary-label">TOMORROW</span>
                <strong id="tomorrowCount">00</strong>
            </button>

            <button
                type="button"
                class="summary-card"
                data-view="someday"
            >
                <span class="summary-label">SOMEDAY</span>
                <strong id="somedayCount">00</strong>
            </button>
        </section>

        <!-- Additional Views -->
        <nav class="extra-nav" aria-label="추가 목록">
            <button
                type="button"
                class="extra-tab"
                data-view="overdue"
            >
                Overdue
                <span id="overdueCount">0</span>
            </button>

            <button
                type="button"
                class="extra-tab"
                data-view="history"
            >
                History
            </button>
        </nav>

        <!-- Task Area -->
        <section class="task-section">

            <div class="section-heading">
                <div>
                    <p class="section-eyebrow" id="sectionEyebrow">
                        YOUR LITTLE STEPS
                    </p>
                    <h2 id="sectionTitle">Today's Tasks</h2>
                </div>

                <span class="task-counter" id="taskCounter">
                    0 tasks
                </span>
            </div>

            <!-- Category Filter -->
            <div class="category-filters" id="categoryFilters">
                <button
                    type="button"
                    class="filter-btn active"
                    data-category="All"
                >
                    All
                </button>
            </div>

            <!-- Task List -->
            <div class="task-list" id="taskList"></div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" hidden>
                <div class="empty-icon">♡</div>
                <p id="emptyMessage">아직 등록된 할 일이 없어요.</p>
                <span>작은 일부터 하나씩 시작해 볼까요?</span>
            </div>

            <!-- Add Button -->
            <button
                type="button"
                class="add-task-button"
                id="openAddButton"
            >
                <span class="plus-icon">+</span>
                Add a new task...
            </button>

        </section>

        <!-- Footer -->
        <footer class="widget-footer">
            Little steps, lovely days.
        </footer>

    </main>

    <!-- Task Form Modal -->
    <div class="modal-backdrop" id="taskModal" hidden>

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <div class="modal-header">
                <div>
                    <p class="eyebrow">LITTLE THINGS</p>
                    <h2 id="modalTitle">New Task ♡</h2>
                </div>

                <button
                    type="button"
                    class="close-button"
                    id="closeModalButton"
                    aria-label="닫기"
                >
                    ×
                </button>
            </div>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskTitle">Task</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="무엇을 해야 하나요?"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                            <option value="Career">Career</option>
                            <option value="Money">Money</option>
                            <option value="Life">Life</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                </div>

                <div class="form-group">
                    <label for="taskSchedule">When?</label>

                    <select id="taskSchedule">
                        <option value="today">Today</option>
                        <option value="tomorrow">Tomorrow</option>
                        <option value="someday">Someday</option>
                        <option value="custom">Choose a date</option>
                    </select>
                </div>

                <div
                    class="form-group"
                    id="customDateGroup"
                    hidden
                >
                    <label for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate">
                </div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="save-button">
                        Save Task ♡
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- Notification -->
    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

</body>
</html>
