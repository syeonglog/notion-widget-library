
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Focus Timer</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"
        defer>
    </script>

    <script src="script.js" defer></script>
</head>

<body>
    <main class="shell">

        <!-- Focus Timer -->
        <section class="card timer-card">

            <header class="heading">
                <div>
                    <h1>Focus Timer</h1>
                    <p>A little progress, every day.</p>
                </div>

                <button
                    id="sound"
                    class="icon-btn"
                    aria-label="Toggle sound"
                    title="Toggle sound">
                    ♪
                </button>
            </header>

            <!-- Timer Modes -->
            <nav
                id="modes"
                class="tabs"
                aria-label="Timer modes">

                <button data-mode="focus" class="active">
                    Focus
                </button>

                <button data-mode="short">
                    Short Break
                </button>

                <button data-mode="long">
                    Long Break
                </button>
            </nav>

            <!-- Circular Timer -->
            <div class="dial">

                <svg viewBox="0 0 220 220" aria-hidden="true">
                    <circle
                        class="track"
                        cx="110"
                        cy="110"
                        r="94">
                    </circle>

                    <circle
                        id="progress"
                        class="progress"
                        cx="110"
                        cy="110"
                        r="94">
                    </circle>
                </svg>

                <div class="dial-center">

                    <div class="time-line">
                        <span id="time">25:00</span>

                        <button
                            id="edit"
                            class="icon-btn small"
                            title="Edit duration"
                            aria-label="Edit duration">
                            <i data-lucide="pencil"></i>
                        </button>
                    </div>

                    <span id="mode-label">
                        FOCUS SESSION
                    </span>

                </div>
            </div>

            <!-- Duration Editor -->
            <div id="editor" class="editor hidden">

                <label for="minutes">
                    Minutes (1–180)
                </label>

                <input
                    id="minutes"
                    type="number"
                    min="1"
                    max="180"
                    step="1">

                <button id="save-minutes">
                    Apply
                </button>

                <button id="cancel-edit" class="subtle">
                    Cancel
                </button>
            </div>

            <!-- Timer Controls -->
            <div class="actions">

                <button id="start" class="primary">
                    Start
                </button>

                <button id="reset" class="secondary">
                    Reset
                </button>

            </div>

            <p
                id="status"
                class="status"
                role="status"
                aria-live="polite">
            </p>

        </section>

        <!-- Daily Focus Log -->
        <section class="card log-card">

            <div class="log-heading">
                <div>
                    <h2>Daily Focus Log</h2>
                    <p>One session at a time.</p>
                </div>

                <button id="today" class="subtle">
                    Today
                </button>
            </div>

            <!-- Date Navigation -->
            <div class="date-nav">

                <button
                    id="prev"
                    aria-label="Previous day">
                    ‹
                </button>

                <strong id="date-label"></strong>

                <button
                    id="next"
                    aria-label="Next day">
                    ›
                </button>

            </div>

            <!-- Daily Statistics -->
            <div class="stats">

                <div>
                    <span>Total Focus Time</span>
                    <strong id="focus-total">0m</strong>
                </div>

                <div>
                    <span>Completed Sessions</span>
                    <strong id="completed-total">0</strong>
                </div>

                <div>
                    <span>Total Break Time</span>
                    <strong id="break-total">0m</strong>
                </div>

            </div>

            <!-- Session History -->
            <div id="logs" class="logs"></div>

        </section>

    </main>
</body>
</html>
